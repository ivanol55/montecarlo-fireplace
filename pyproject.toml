[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fireplace"
version = "0.1.0"
description = "Monte Carlo retirement simulator with bucket withdrawals, Spain-aware tax, and pluggable expense windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iván Méndez" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "plotly>=5.18",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.4"]
fetch = ["yfinance>=0.2.40"]

[project.scripts]
fireplace = "fireplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fireplace = ["../data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"
